networks:
  nextcloud:

services:

  # --- MariaDB Database ---
  db:
    container_name: nextcloud-db
    image: mariadb:11.8
    restart: always
    command: >
      --transaction-isolation=READ-COMMITTED
      --log-bin=binlog
      --binlog-format=ROW
      --log_bin_trust_function_creators=1
      --max_allowed_packet=256M
      --wait_timeout=28800
      --net_read_timeout=120
      --net_write_timeout=300
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - nextcloud
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis Cache ---
  redis:
    container_name: nextcloud-redis
    image: redis:alpine
    restart: always
    networks:
      - nextcloud

  # --- Nextcloud App (PHP-FPM) ---
  app:
    container_name: nextcloud-app
    build:
      context: .
      dockerfile: Dockerfile
    image: iamjavadali/nextcloudpi
    restart: always
    networks:
      - nextcloud
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/var/www/html
    environment:
      # --- Database connection ---
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}

      # --- Redis caching ---
      - REDIS_HOST=${REDIS_HOST}

      # --- Nextcloud initial setup ---
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}

      # --- Trusted domains and proxy / overwrite settings ---
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - TRUSTED_PROXIES_NEXTCLOUD=${TRUSTED_PROXIES_NEXTCLOUD}

      # URL used by Nextcloud CLI jobs and generated links
      - OVERWRITECLIURL=${OVERWRITECLIURL}

      # Hostname:port users access in the browser
      - OVERWRITEHOST=${OVERWRITEHOST}

      # Protocol users access in the browser:
      # use "http" for direct local/LAN testing with no TLS
      # use "https" when behind a reverse proxy / tunnel / SSL terminator
      - OVERWRITEPROTOCOL=${OVERWRITEPROTOCOL}

      # --- PHP / Runtime settings ---
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME}

      # --- OPCache settings ---
      - OPCACHE_MEM_SIZE=${OPCACHE_MEM_SIZE}
      - OPCACHE_MAX_ACCELERATED_FILES=${OPCACHE_MAX_ACCELERATED_FILES}
      - OPCACHE_INTERNED_STRINGS_BUFFER=${OPCACHE_INTERNED_STRINGS_BUFFER}
      - OPCACHE_REVALIDATE_FREQ=${OPCACHE_REVALIDATE_FREQ}

      # --- Email / SMTP settings ---
      - SMTP_MODE=${SMTP_MODE}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_PORT=${SMTP_PORT}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}

  # --- Background Cron Jobs ---
  cron:
    container_name: nextcloud-cron
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    entrypoint: /cron.sh
    depends_on:
      - app
    networks:
      - nextcloud
    volumes:
      - ./app:/var/www/html
    environment:
      # Keep cron aligned with the same URL/origin settings as app
      - OVERWRITECLIURL=${OVERWRITECLIURL}
      - OVERWRITEHOST=${OVERWRITEHOST}
      - OVERWRITEPROTOCOL=${OVERWRITEPROTOCOL}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - TRUSTED_PROXIES_NEXTCLOUD=${TRUSTED_PROXIES_NEXTCLOUD}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME}
      - OPCACHE_MEM_SIZE=${OPCACHE_MEM_SIZE}
      - OPCACHE_MAX_ACCELERATED_FILES=${OPCACHE_MAX_ACCELERATED_FILES}
      - OPCACHE_INTERNED_STRINGS_BUFFER=${OPCACHE_INTERNED_STRINGS_BUFFER}
      - OPCACHE_REVALIDATE_FREQ=${OPCACHE_REVALIDATE_FREQ}

  # --- Nginx Web (FastCGI bridge) ---
  web:
    container_name: nextcloud-web
    image: nginx:stable-alpine
    restart: always
    depends_on:
      - app
    networks:
      - nextcloud
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app:/var/www/html
