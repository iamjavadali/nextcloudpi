worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    types {
        text/javascript mjs;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Prevent nginx version disclosure
    server_tokens off;

    # Docker internal DNS — required for container name resolution
    resolver 127.0.0.11 valid=30s;

    # Set the `immutable` cache control option only for assets with a cache-busting `v` argument
    map $arg_v $asset_immutable {
        ""      "";
        default ", immutable";
    }

    upstream php-handler {
        server app:9000;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types
        application/atom+xml
        text/javascript application/javascript
        application/json application/ld+json
        application/manifest+json application/rss+xml
        application/vnd.geo+json application/vnd.ms-fontobject
        application/wasm application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml application/xml
        font/opentype image/bmp image/svg+xml image/x-icon
        text/cache-manifest text/css text/plain text/vcard
        text/vnd.rim.location.xloc text/vtt
        text/x-component text/x-cross-domain-policy;

    server {
        listen 80;
        # No server_name needed — this is an internal container.
        # nginx-proxy-manager handles domain routing externally.

        # Match PHP_UPLOAD_LIMIT in .env
        client_max_body_size 10G;
        client_body_timeout 300s;
        client_body_buffer_size 512k;

        fastcgi_buffers 64 4K;

        # Security headers
        # HSTS is intentionally omitted here — nginx-proxy-manager owns that header.
        add_header Referrer-Policy                   "no-referrer"       always;
        add_header X-Content-Type-Options            "nosniff"           always;
        add_header X-Frame-Options                   "SAMEORIGIN"        always;
        add_header X-Permitted-Cross-Domain-Policies "none"              always;
        add_header X-Robots-Tag                      "noindex, nofollow" always;

        # Suppress PHP version leak
        fastcgi_hide_header X-Powered-By;

        root  /var/www/html;
        index index.php index.html /index.php$request_uri;

        # Microsoft DAV client redirect
        location = / {
            if ($http_user_agent ~ ^DavClnt) {
                return 302 /remote.php/webdav/$is_args$args;
            }
        }

        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log    off;
        }

        # Well-known URLs (CalDAV / CardDAV / ACME)
        location ^~ /.well-known {
            location = /.well-known/carddav { return 301 /remote.php/dav/; }
            location = /.well-known/caldav  { return 301 /remote.php/dav/; }
            location /.well-known/acme-challenge  { try_files $uri $uri/ =404; }
            location /.well-known/pki-validation  { try_files $uri $uri/ =404; }
            return 301 /index.php$request_uri;
        }

        # Block access to sensitive paths — return 404 to avoid revealing existence
        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)               { return 404; }

        # PHP handler — must appear before the static file block
        location ~ \.php(?:$|/) {
            # Legacy support rewrite
            rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;

            try_files $fastcgi_script_name =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $path_info;
            # Tell PHP the upstream client connection is HTTPS even though
            # this container receives plain HTTP from nginx-proxy-manager.
            fastcgi_param HTTPS           on;

            # Prevent PHP from adding security headers that nginx already sets above
            fastcgi_param modHeadersAvailable true;
            # Enable Nextcloud pretty URLs
            fastcgi_param front_controller_active true;

            fastcgi_pass php-handler;

            fastcgi_intercept_errors    on;
            fastcgi_request_buffering   on;
            fastcgi_max_temp_file_size  0;
        }

        # Static assets — images, scripts, styles, media
        location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
            try_files $uri /index.php$request_uri;
            add_header Cache-Control "public, max-age=15778463$asset_immutable";
            add_header Referrer-Policy                   "no-referrer"       always;
            add_header X-Content-Type-Options            "nosniff"           always;
            add_header X-Frame-Options                   "SAMEORIGIN"        always;
            add_header X-Permitted-Cross-Domain-Policies "none"              always;
            add_header X-Robots-Tag                      "noindex, nofollow" always;
            access_log off;
        }

        # Font files
        location ~ \.(otf|woff2?)$ {
            try_files $uri /index.php$request_uri;
            expires    7d;
            access_log off;
        }

        # WebDAV remote redirect
        location /remote {
            return 301 /remote.php$request_uri;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
}
